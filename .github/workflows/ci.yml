name: Simple CI Pipeline

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches : ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  


  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run a simple command
        run: echo "This is my pipeline automation"

      - name: step1
        run: echo "This is my step1"

      - name: step2
        run: echo "This is my step2"

      - name: breaking pipeline
        run: echo "pipeline is fixed"

      - name: Login to GHCR
        run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build a Docker image
        run: docker build -t ghcr.io/${{ github.actor }}/mydoc:v1 .

      - name: Push a docker image
        run: docker push ghcr.io/${{ github.actor }}/mydoc:v1

        

      - name: Build docker image
        run: docker build -t devops .
           
